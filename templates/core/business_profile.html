{% extends "base.html" %}

{% block title %}Business Profile{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h2 class="section-title">
            <i class="bi bi-building"></i>
            Business Profile
        </h2>
        <p class="text-muted">
            Keep your business information up to date. This information is used throughout the application.
        </p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="sf-card">
            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle me-2"></i>Save Changes
                    </button>

                    <a href="{% url 'core:dashboard' %}" class="btn btn-outline-primary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
