{% extends "base.html" %}

{% block title %}Payment Cancelled{% endblock %}

{% block content %}

<div class="sf-card text-center">
    <div class="py-4">

        <i class="bi bi-x-circle-fill text-danger" style="font-size:4rem;"></i>
        <h2 class="mt-4">Payment Cancelled</h2>
        <p class="text-muted">Your payment was cancelled. No charges were made.</p>

        <a href="{% url 'payments:upgrade' %}" class="btn btn-outline-primary mt-3">
            <i class="bi bi-arrow-left me-2"></i> Back
        </a>
        
    </div>
</div>

{% endblock %}
