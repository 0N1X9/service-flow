{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h2 class="section-title"><i class="bi bi-tools"></i>{{ title }}</h2>
        <p class="text-muted">Enter the job information below.</p>
    </div>
</div>

<div class="sf-card">
    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}
        
        <div class="mt-4 d-flex gap-2">
            <button class="btn btn-primary" type="submit">
                <i class="bi bi-check-circle me-2"></i>Save Job
            </button>
            <a href="{% url 'services:list' %}" class="btn btn-outline-primary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
