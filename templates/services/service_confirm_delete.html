{% extends "base.html" %}

{% block title %}Delete Job{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-body">

        <h2>Delete Job</h2>

        <p>

            Are you sure you want to delete

            <strong>{{ service.title }}</strong>?

        </p>

        <form method="post">

            {% csrf_token %}

            <button class="btn btn-danger">

                Delete

            </button>

            <a href="{% url 'services:list' %}" class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
