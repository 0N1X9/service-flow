{% extends "base.html" %}

{% block title %}Delete Job{% endblock %}

{% block content %}

<div class="sf-card text-center">
    <div class="empty-state py-4">
        <i class="bi bi-trash text-danger"></i><h3>Delete Job</h3>
        <p>Are you sure you want to permanently delete <strong> {{ service.title }}</strong>?</p>
        <p class="text-muted-small">This action cannot be undone.</p>

        <form method="post" class="mt-4">

            {% csrf_token %}

            <button class="btn btn-danger">Delete Job</button>
            <a href="{% url 'services:list' %}" class="btn btn-outline-primary">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}
