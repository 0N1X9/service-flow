{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-body">

        <h2>{{ title }}</h2>

        <hr>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-primary" type="submit">

                Save

            </button>

            <a href="{% url 'clients:list' %}" class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
