{% extends "base.html" %}

{% block title %}Delete Client{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-body">

        <h2>Delete Client</h2>

        <p>

            Are you sure you want to delete

            <strong>{{ client.name }}</strong>?

        </p>

        <form method="post">

            {% csrf_token %}

            <button class="btn btn-danger" type="submit">

                Delete

            </button>

            <a href="{% url 'clients:list' %}" class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
