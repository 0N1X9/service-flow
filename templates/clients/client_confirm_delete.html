{% extends "base.html" %}

{% block title %}Delete Client{% endblock %}

{% block content %}

<div class="sf-card text-center">
    <div class="empty-state py-4">
        <i class="bi bi-trash text-danger"></i>
        <h3>Delete Client</h3>
        <p>Are you sure you want to permanently delete <strong>{{ client.name }}</strong>?</p>
        <p class="text-muted-small">This action cannot be undone.</p>

        <form method="post" class="mt-4">

            {% csrf_token %}

            <button class="btn btn-danger">Delete Client</button>
            <a href="{% url 'clients:list' %}" class="btn btn-outline-primary">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}
