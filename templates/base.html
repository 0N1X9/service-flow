<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Service Flow AI{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <link rel="stylesheet" href="{% static 'css/utilities.css' %}">
</head>

<body>

    <nav class="navbar navbar-expand-lg shadow-sm" >
        <div class="container py-4">
            <a class="navbar-brand" href="{% url 'core:dashboard' %}">
                <span class="fw-bold"><i class="bi bi-robot me-1"></i>Service Flow AI</span>
            </a>
            <div class="ms-auto">

                {% if user.is_authenticated %}
                <a class="btn btn-outline-light me-2" href="{% url 'core:dashboard' %}">Dashboard</a>
                <a href="{% url 'clients:list' %}" class="btn btn-outline-light me-2">Clients</a>
                <a href="{% url 'services:list' %}" class="btn btn-outline-light me-2">Jobs</a>
                <a class="btn btn-outline-light me-2" href="{% url 'core:business-profile' %}">Business Profile</a>

                <form method="post" action="{% url 'accounts:logout' %}" class="d-inline">

                    {% csrf_token %}
                    <button class="btn btn-danger" type="submit">Logout</button>
                </form>

                {% else %}
                <a class="btn btn-outline-light me-2" href="{% url 'accounts:login' %}">Login</a>

                <a class="btn btn-primary" href="{% url 'accounts:register' %}">Register</a>
                {% endif %}

            </div>
        </div>
    </nav>

    <div class="container py-4 mt-4">

        {% if messages %}
        {% for message in messages %}

        <div class="alert alert-success">
            {{ message }}
        </div>

        {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
