<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Service Flow AI{% endblock %}</title>

    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'core:dashboard' %}">Service Flow AI</a>
            <div class="ms-auto">

                {% if user.is_authenticated %}
                <a class="btn btn-outline-light me-2" href="{% url 'core:dashboard' %}">Dashboard</a>
                <a class="btn btn-outline-light me-2" href="{% url 'core:business-profile' %}">Business Profile</a>

                <form method="post" action="{% url 'accounts:logout' %}" class="d-inline">

                    {% csrf_token %}
                    <button class="btn btn-danger" type="submit">Logout</button>
                </form>

                {% else %}
                <a class="btn btn-outline-light me-2" href="{% url 'accounts:login' %}">Login</a>

                <a class="btn btn-primary" href="{% url 'accounts:register' %}">Register</a>
                {% endif %}

            </div>
        </div>
    </nav>

    <div class="container mt-4">

        {% if messages %}
        {% for message in messages %}

        <div class="alert alert-success">
            {{ message }}
        </div>

        {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
