{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="sf-card">

            <div class="text-center mb-4">
                <i class="bi bi-box-arrow-in-right" style="font-size:3rem;color:var(--primary);"></i>
                <h2 class="mt-3"> Welcome Back </h2>
                <p class="text-muted-small">Sign in to continue to Service Flow AI.</p>
            </div>

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <div class="d-grid mt-4">
                    <button class="btn btn-primary btn-lg" type="submit">Login</button>
                </div>
            </form>

            <hr>

            <p class="text-center mb-0">Don't have an account?
                <a href="{% url 'accounts:register' %}">Create one</a>
            </p>
            
        </div>
    </div>
</div>

{% endblock %}
